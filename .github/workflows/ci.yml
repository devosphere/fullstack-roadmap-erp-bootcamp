name: CI

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main

jobs:
  repository-health:
    name: Repository Health
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required root files
        run: |
          test -s README.md
          test -s CONTRIBUTING.md
          test -f CHANGELOG.md
          test -s .gitignore

      - name: Check required folders
        run: |
          test -d academy
          test -d docs
          test -d frontend
          test -d backend
          test -d database
          test -d tests
          test -d infrastructure
          test -d scripts
          test -d .github

      - name: Check GitHub templates
        run: |
          test -s .github/PULL_REQUEST_TEMPLATE.md
          test -s .github/ISSUE_TEMPLATE/config.yml
          test -s .github/ISSUE_TEMPLATE/feature.md
          test -s .github/ISSUE_TEMPLATE/bug.md
          test -s .github/ISSUE_TEMPLATE/task.md
          test -s .github/ISSUE_TEMPLATE/improvement.md
          test -s .github/ISSUE_TEMPLATE/documentation.md

      - name: Summary
        run: echo "Repository health checks passed."

  frontend: 
    name: Frontend
    runs-on: ubuntu-latest

    steps: 
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build Next.js app
        run: npm run build

  backend: 
    name: Backend
    runs-on: ubuntu-latest

    steps: 
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build backend app
        run: npm run build



